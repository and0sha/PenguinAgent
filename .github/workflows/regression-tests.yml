name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}/penguinagent-matplotlib
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # pinned revision
        with:
          python-version: "3.12"
      # These regression tests use real PNG rendering and stub external ML services.
      # They do not need CUDA, model weights, or a populated SAM 3 submodule.
      - run: python -m pip install "matplotlib>=3.8,<4"
      - name: Install Linux video test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check Linux bootstrap syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/setup_sam3_wsl.sh
      - run: python -B -m unittest discover -s tests -v
      - name: Check dependency-free entry points
        run: |
          python -B scripts/smoke_tracking.py --help
          python -B tools/train_linear_probe.py --help
